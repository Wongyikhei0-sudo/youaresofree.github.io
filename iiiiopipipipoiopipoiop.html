<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculus Quiz - 國際符號版</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --success: #059669;
            --error: #dc2626;
            --bg: #f8fafc;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 20px; }
        .quiz-container { background: white; width: 100%; max-width: 600px; padding: 2rem; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #1e293b; font-size: 1.5rem; margin-bottom: 1.5rem; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
        .question-box { margin-bottom: 1.5rem; font-size: 1.2rem; color: #334155; min-height: 80px; }
        .options { display: grid; gap: 10px; }
        .opt-btn { background: white; border: 2px solid #e2e8f0; padding: 12px 20px; border-radius: 8px; cursor: pointer; text-align: left; font-size: 1.1rem; transition: all 0.2s; }
        .opt-btn:hover { border-color: var(--primary); background: #eff6ff; }
        .feedback { margin-top: 1.5rem; padding: 15px; border-radius: 8px; display: none; line-height: 1.5; }
        .next-btn { display: block; width: 100%; margin-top: 1rem; background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; display: none; }
        .score-board { text-align: center; font-weight: bold; color: var(--primary); margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="quiz-container">
    <h1>∫ Calculus Challenge ∂</h1>
    <div class="score-board" id="progress">關卡: 1 / 5</div>

    <div class="question-box" id="question">
        </div>

    <div class="options" id="options">
        </div>

    <div id="feedback" class="feedback"></div>
    <button id="next-btn" class="next-btn">下一題 Next Step</button>
</div>

<script>
    const questions = [
        {
            q: "Evaluate the derivative: <br>$$\\frac{d}{dx}(5x^3 - 2x + 10)$$",
            options: ["15x^2 - 2", "5x^2 - 2", "15x^3 - 2", "30x - 2"],
            ans: 0,
            note: "Using Power Rule: \\(\\frac{d}{dx} x^n = nx^{n-1}\\)."
        },
        {
            q: "Apply the Chain Rule: <br>$$\\frac{d}{dx} e^{x^2}$$",
            options: ["e^{x^2}", "2x \\cdot e^{x^2}", "x^2 \\cdot e^{x^2-1}", "e^{2x}"],
            ans: 1,
            note: "Chain Rule: \\(f(g(x))' = f'(g(x)) \\cdot g'(x)\\)."
        },
        {
            q: "Evaluate the indefinite integral: <br>$$\\int \\cos(x) \\, dx$$",
            options: ["\\sin(x) + C", "-\\sin(x) + C", "\\tan(x) + C", "\\cos^2(x) + C"],
            ans: 0,
            note: "The derivative of \\(\\sin(x)\\) is \\(\\cos(x)\\)."
        },
        {
            q: "Solve the definite integral: <br>$$\\int_{0}^{2} 3x^2 \\, dx$$",
            options: ["4", "6", "8", "12"],
            ans: 2,
            note: "\\(\\int 3x^2 dx = x^3\\). Evaluated from 0 to 2: \\(2^3 - 0^3 = 8\\)."
        },
        {
            q: "Identify the Fundamental Theorem of Calculus:",
            options: [
                "\\int_{a}^{b} f(x) dx = F(b) - F(a)",
                "\\frac{dy}{dx} = \\lim_{h \\to 0} \\frac{f(x+h)-f(x)}{h}",
                "a^2 + b^2 = c^2",
                "e^{i\\pi} + 1 = 0"
            ],
            ans: 0,
            note: "This theorem links differentiation and integration."
        }
    ];

    let currentQ = 0;

    function renderMath() {
        if (window.MathJax) {
            MathJax.typesetPromise();
        }
    }

    function loadQuestion() {
        const qData = questions[currentQ];
        document.getElementById('progress').innerText = `關卡: ${currentQ + 1} / ${questions.length}`;
        document.getElementById('question').innerHTML = qData.q;

        const optContainer = document.getElementById('options');
        optContainer.innerHTML = '';

        qData.options.forEach((text, i) => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.innerHTML = `\\( (${String.fromCharCode(65+i)}) \\quad ${text} \\)`;
            btn.onclick = () => checkAnswer(i);
            optContainer.appendChild(btn);
        });

        document.getElementById('feedback').style.display = 'none';
        document.getElementById('next-btn').style.display = 'none';
        renderMath();
    }

    function checkAnswer(idx) {
        const qData = questions[currentQ];
        const fb = document.getElementById('feedback');
        fb.style.display = 'block';

        if (idx === qData.ans) {
            fb.style.background = '#d1fae5';
            fb.style.color = '#065f46';
            fb.innerHTML = `<strong>Correct!</strong> <br> ${qData.note}`;
            document.getElementById('next-btn').style.display = 'block';
        } else {
            fb.style.background = '#fee2e2';
            fb.style.color = '#991b1b';
            fb.innerHTML = `<strong>Try Again!</strong> 檢查一下運算規則。`;
        }
        renderMath();
    }

    document.getElementById('next-btn').onclick = () => {
        currentQ++;
        if (currentQ < questions.length) {
            loadQuestion();
        } else {
            document.querySelector('.quiz-container').innerHTML = `
                <h1>🎉 挑戰完成！</h1>
                <p style="text-align:center">你已經掌握了微積分的基本符號與運算。<br>Keep practicing!</p>
                <button onclick="location.reload()" class="next-btn" style="display:block">重新開始</button>
            `;
        }
    };

    loadQuestion();
</script>

</body>
</html>
